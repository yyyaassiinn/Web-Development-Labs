<!doctype html>
<html>
    <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Name List</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger-hover: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--text);
      transition: color 0.2s ease;
    }

    .input-group {
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    li:hover {
      background-color: rgba(239, 68, 68, 0.1);
      border-color: var(--danger-hover);
      color: #fca5a5;
    }

    li::after {
      content: '✕';
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    li:hover::after {
      opacity: 1;
    }
  </style>
</head>
<body>
    <div class="container">
  <h1 id="title">Welcome</h1>
  <div class="input-group">
  <input id="name" placeholder="Your name" />
  <button id="greet">Greet</button>
  <ul id="list"></ul>
</div>

      document.getElementById('title').textContent = `Hello, ${name}!`;

      const li = document.createElement('li');
      li.textContent = name;
      document.getElementById('list').appendChild(li);

      input.value = ''; // clear input box
    }

    // Function to say goodbye when a name is clicked
    function removeName(e) {
      if (e.target.nodeName === 'LI') {
        const name = e.target.textContent;
        document.getElementById('title').textContent = `Goodbye, ${name}! see you later.`;
        e.target.remove(); // remove the clicked <li>
      }
    }

    // Attach event listeners
    document.getElementById('greet').addEventListener('click', addName);
    document.getElementById('list').addEventListener('click', removeName);
  </script>
</body>
</html>
